name: Batch 3 coder

on:
  push:
    branches: [batch-3-fixes]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Apply Batch 3 fixes
        run: python3 scripts/apply_batch3.py

      - name: Format changed Kotlin
        run: |
          set -euxo pipefail
          ./gradlew :app:ktlintFormat --no-daemon
          git checkout -- .github/workflows scripts
          allowed='^app/src/main/kotlin/com/metrolist/music/viewmodels/OnlineSearchViewModel.kt$|^app/src/main/kotlin/com/metrolist/music/ui/screens/search/OnlineSearchResult.kt$|^app/src/main/kotlin/com/metrolist/music/playback/MediaLibrarySessionCallback.kt$|^app/src/main/kotlin/com/metrolist/music/playback/MusicService.kt$'
          git status --short
          git diff --name-only | grep -Ev "$allowed" | while read -r file; do git checkout -- "$file"; done || true

      - name: Unit tests, lint, and FOSS debug build
        run: |
          set -euxo pipefail
          ./gradlew :app:testFossDebugUnitTest --no-daemon
          ./gradlew :app:lintFossDebug --no-daemon
          ./gradlew :app:assembleFossDebug --no-daemon
          git diff --check

      - name: Review and squash into one final Batch 3 commit
        run: |
          set -euxo pipefail
          git rm -f scripts/apply_batch3.py .github/workflows/batch3-coder.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git reset --soft origin/main
          git diff --cached --name-only
          git diff --cached --name-only | grep -E '^app/src/main/(kotlin/com/metrolist/music/viewmodels/OnlineSearchViewModel.kt|kotlin/com/metrolist/music/ui/screens/search/OnlineSearchResult.kt|kotlin/com/metrolist/music/playback/MediaLibrarySessionCallback.kt|kotlin/com/metrolist/music/playback/MusicService.kt)$'
          test "$(git diff --cached --name-only | wc -l)" -eq 4
          git commit -m 'fix: resolve search, Android Auto, and playback recovery issues'
          git push --force origin HEAD:batch-3-fixes
