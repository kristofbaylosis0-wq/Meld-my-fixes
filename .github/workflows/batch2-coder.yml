name: Batch 2 coder
on:
  push:
    branches: [batch-2-fixes]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Apply root-cause fixes
        shell: python
        run: |
          from pathlib import Path

          def edit(path, old, new, count=1):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f"Expected source pattern not found: {path}: {old[:120]!r}")
              p.write_text(s.replace(old, new, count))

          # #223 + #239: don't expose partially paged Spotify collections as complete,
          # and accumulate pages with stable-ID deduplication in linear time.
          p = Path('app/src/main/kotlin/com/metrolist/music/viewmodels/SpotifyPlaylistViewModel.kt')
          s = p.read_text()
          old = '''            val firstItems = paging.items\n                .filter { it.track != null && !it.isLocal }\n\n            // Emit first page immediately so the UI shows content fast\n            _playlistItems.value = firstItems\n            _tracks.value = firstItems.mapNotNull { it.track }\n            _isLoading.value = false\n\n            val remaining = paging.total - paging.items.size\n            if (remaining <= 0) return@onSuccess\n\n            // Fetch remaining pages in parallel batches, emitting progressively\n            val allItems = firstItems.toMutableList()\n'''
          new = '''            val firstItems = paging.items\n                .filter { it.track != null && !it.isLocal }\n\n            // Keep the first page visible, but remain in the loading state until every\n            // page has arrived. The play button must never capture a partial playlist.\n            val allItemsByTrackId = LinkedHashMap<String, SpotifyPlaylistTrack>(paging.items.size)\n            firstItems.forEach { item -> item.track?.let { allItemsByTrackId.putIfAbsent(it.id, item) } }\n            _playlistItems.value = allItemsByTrackId.values.toList()\n            _tracks.value = allItemsByTrackId.values.mapNotNull { it.track }\n\n            val remaining = paging.total - paging.items.size\n            if (remaining <= 0) {\n                _isLoading.value = false\n                return@onSuccess\n            }\n\n            // Fetch remaining pages in parallel batches, emitting progressively.\n            // LinkedHashMap gives deterministic ordering and O(n) duplicate handling.\n'''
          if old not in s: raise SystemExit('playlist first-page pattern missing')
          s = s.replace(old, new, 1)
          edit_text = '''                    result.onSuccess { page ->\n                        allItems.addAll(page.items.filter { it.track != null && !it.isLocal })\n                    }.onFailure { e ->\n'''
          replacement = '''                    result.onSuccess { page ->\n                        page.items\n                            .filter { it.track != null && !it.isLocal }\n                            .forEach { item -> item.track?.let { allItemsByTrackId.putIfAbsent(it.id, item) } }\n                    }.onFailure { e ->\n'''
          if edit_text not in s: raise SystemExit('playlist page pattern missing')
          s = s.replace(edit_text, replacement, 1)
          old = '''                _playlistItems.value = allItems.toList()\n                _tracks.value = allItems.mapNotNull { it.track }\n\n                if (failed) break\n            }\n        }.onFailure { e ->\n'''
          new = '''                _playlistItems.value = allItemsByTrackId.values.toList()\n                _tracks.value = allItemsByTrackId.values.mapNotNull { it.track }\n\n                if (failed) break\n            }\n            _isLoading.value = false\n        }.onFailure { e ->\n'''
          if old not in s: raise SystemExit('playlist completion pattern missing')
          p.write_text(s.replace(old, new, 1))

          p = Path('app/src/main/kotlin/com/metrolist/music/viewmodels/SpotifyLikedSongsViewModel.kt')
          s = p.read_text()
          old = '''            val firstPage = paging.items\n                .map { it.track }\n                .filter { !it.isLocal }\n\n            _total.value = paging.total\n\n            // Emit first page immediately so the UI shows content within ~500ms\n            _tracks.value = firstPage\n            _isLoading.value = false\n\n            val remaining = paging.total - paging.items.size\n            if (remaining <= 0) {\n                Timber.d("SpotifyLikedSongs: Loaded ${firstPage.size} tracks (all in first page)")\n                return@onSuccess\n            }\n\n            // Fetch remaining pages in parallel batches to avoid rate-limiting.\n            // GROUP_SIZE concurrent requests at a time, emitting results progressively.\n            val allTracks = firstPage.toMutableList()\n'''
          new = '''            val firstPage = paging.items\n                .map { it.track }\n                .filter { !it.isLocal }\n\n            _total.value = paging.total\n\n            // Show the first page immediately, but don't mark the source complete until\n            // every page has been fetched. Stable Spotify IDs make deduplication linear.\n            val allTracksById = LinkedHashMap<String, SpotifyTrack>(paging.items.size)\n            firstPage.forEach { allTracksById.putIfAbsent(it.id, it) }\n            _tracks.value = allTracksById.values.toList()\n\n            val remaining = paging.total - paging.items.size\n            if (remaining <= 0) {\n                _isLoading.value = false\n                Timber.d("SpotifyLikedSongs: Loaded ${allTracksById.size} tracks (all in first page)")\n                return@onSuccess\n            }\n\n            // Fetch remaining pages in parallel batches to avoid rate-limiting.\n            val allTracks = allTracksById\n'''
          if old not in s: raise SystemExit('liked first-page pattern missing')
          s = s.replace(old, new, 1)
          old = '''                    result.onSuccess { page ->\n                        allTracks.addAll(page.items.map { it.track }.filter { !it.isLocal })\n                    }.onFailure { e ->\n'''
          new = '''                    result.onSuccess { page ->\n                        page.items\n                            .map { it.track }\n                            .filter { !it.isLocal }\n                            .forEach { allTracks.putIfAbsent(it.id, it) }\n                    }.onFailure { e ->\n'''
          if old not in s: raise SystemExit('liked page pattern missing')
          s = s.replace(old, new, 1)
          old = '''                _tracks.value = allTracks.toList()\n\n                if (failed) break\n            }\n\n            Timber.d("SpotifyLikedSongs: Loaded ${allTracks.size} tracks (total=${paging.total})")\n'''
          new = '''                _tracks.value = allTracks.values.toList()\n\n                if (failed) break\n            }\n\n            _isLoading.value = false\n            Timber.d("SpotifyLikedSongs: Loaded ${allTracks.size} tracks (total=${paging.total})")\n'''
          if old not in s: raise SystemExit('liked completion pattern missing')
          p.write_text(s.replace(old, new, 1))

          # #223: dedupe paged queue accumulation and propagate coroutine cancellation.
          p = Path('app/src/main/kotlin/com/metrolist/music/playback/queues/SpotifyPagedQueue.kt')
          s = p.read_text()
          s = s.replace('import kotlinx.coroutines.coroutineScope\n', 'import kotlinx.coroutines.coroutineScope\nimport kotlinx.coroutines.CancellationException\n', 1)
          s = s.replace('''    private val allTracks = mutableListOf<SpotifyTrack>()\n''', '''    private val allTracks = mutableListOf<SpotifyTrack>()\n    private val seenSpotifyIds = HashSet<String>()\n\n    private fun appendUniqueTracks(tracks: List<SpotifyTrack>) {\n        tracks.forEach { if (seenSpotifyIds.add(it.id)) allTracks.add(it) }\n    }\n''', 1)
          s = s.replace('allTracks.addAll(provided)', 'appendUniqueTracks(provided)', 2)
          s = s.replace('allTracks.addAll(page.tracks)', 'appendUniqueTracks(page.tracks)', 2)
          s = s.replace('''            allTracks.clear()\n            val provided = providedTracks\n''', '''            allTracks.clear()\n            seenSpotifyIds.clear()\n            val provided = providedTracks\n''', 1)
          s = s.replace('''        } catch (e: Exception) {\n            Timber.e(e, "$logTag: Failed initial fetch")\n''', '''        } catch (e: CancellationException) {\n            throw e\n        } catch (e: Exception) {\n            Timber.e(e, "$logTag: Failed initial fetch")\n''', 1)
          s = s.replace('''        } catch (e: Exception) {\n            Timber.e(e, "$logTag: getFullStatus failed")\n''', '''        } catch (e: CancellationException) {\n            throw e\n        } catch (e: Exception) {\n            Timber.e(e, "$logTag: getFullStatus failed")\n''', 1)
          s = s.replace('''        } catch (e: Exception) {\n            Timber.e(e, "$logTag: Failed to fetch next API page")\n            apiHasMore = false\n''', '''        } catch (e: CancellationException) {\n            throw e\n        } catch (e: Exception) {\n            Timber.e(e, "$logTag: Failed to fetch next API page")\n            apiHasMore = false\n''', 1)
          p.write_text(s)

          # #224: monotonic elapsed-time crossfade, with a real zero-duration no-op.
          p = Path('app/src/main/kotlin/com/metrolist/music/playback/MusicService.kt')
          s = p.read_text()
          s = s.replace('import android.os.Looper\n', 'import android.os.Looper\nimport android.os.SystemClock\n', 1)
          old = '''                val duration = crossfadeDuration.toLong()\n                val steps = 20\n                val stepTime = duration / steps\n                val startVolume =\n                    try {\n                        fadingPlayer?.volume ?: 1f\n                    } catch (e: Exception) {\n                        1f\n                    }\n\n                for (i in 0..steps) {\n                    if (!isActive) break\n                    // Pause volume ramp if player is paused\n                    while (!player.isPlaying && isActive) {\n                        delay(100)\n                    }\n\n                    val progress = i / steps.toFloat()\n                    val fadeIn = 1.0f - (1.0f - progress) * (1.0f - progress)\n                    val fadeOut = (1.0f - progress) * (1.0f - progress)\n\n                    try {\n                        player.volume = startVolume * fadeIn\n                        fadingPlayer?.volume = startVolume * fadeOut\n                    } catch (e: Exception) {\n                        break\n                    }\n\n                    delay(stepTime)\n                }\n'''
          new = '''                val duration = crossfadeDuration.toLong().coerceAtLeast(0L)\n                val startVolume =\n                    try {\n                        fadingPlayer?.volume ?: 1f\n                    } catch (e: Exception) {\n                        1f\n                    }\n\n                if (duration > 0L) {\n                    val startTime = SystemClock.elapsedRealtime()\n                    while (isActive) {\n                        while (!player.isPlaying && isActive) delay(100)\n                        if (!isActive) break\n\n                        val elapsed = (SystemClock.elapsedRealtime() - startTime).coerceAtLeast(0L)\n                        val progress = (elapsed.toDouble() / duration.toDouble()).coerceIn(0.0, 1.0).toFloat()\n                        val fadeIn = 1.0f - (1.0f - progress) * (1.0f - progress)\n                        val fadeOut = (1.0f - progress) * (1.0f - progress)\n\n                        try {\n                            player.volume = startVolume * fadeIn\n                            fadingPlayer?.volume = startVolume * fadeOut\n                        } catch (e: Exception) {\n                            break\n                        }\n\n                        if (progress >= 1f) break\n                        delay((duration - elapsed).coerceAtMost(16L).coerceAtLeast(1L))\n                    }\n                }\n'''
          if old not in s: raise SystemExit('crossfade loop pattern missing')
          s = s.replace(old, new, 1)
          s = s.replace('''        if (!crossfadeEnabled || player.duration == C.TIME_UNSET || player.duration <= crossfadeDuration) return\n''', '''        if (!crossfadeEnabled || crossfadeDuration <= 0f || player.duration == C.TIME_UNSET || player.duration <= crossfadeDuration) return\n''', 1)

          # #235: stale Spotify mapping recovery is one rematch per failed media id.
          s = s.replace('''    private var crossfadeTriggerJob: Job? = null\n''', '''    private var crossfadeTriggerJob: Job? = null\n\n    private val spotifyYouTubeMapper by lazy { SpotifyYouTubeMapper(database) }\n    private val spotifyRematchAttempts = java.util.concurrent.ConcurrentHashMap.newKeySet<String>()\n''', 1)
          marker = '''        // Check if this song has failed too many times\n'''
          insert = '''        if (mediaId != null && spotifyRematchAttempts.add(mediaId)) {\n            val spotifyTrack = SpotifyMetadataRegistry.get(mediaId)\n            if (spotifyTrack != null) {\n                scope.launch(SilentHandler) {\n                    try {\n                        spotifyYouTubeMapper.invalidateMatch(spotifyTrack.id)\n                        val rematched = spotifyYouTubeMapper.resolveToMediaItem(spotifyTrack)\n                        if (rematched != null && player.currentMediaItem?.mediaId == mediaId) {\n                            val position = player.currentPosition.coerceAtLeast(0L)\n                            player.setMediaItem(rematched, position)\n                            player.prepare()\n                            player.playWhenReady = true\n                            SpotifyMetadataRegistry.invalidate(mediaId)\n                            Timber.tag(TAG).d("Recovered stale Spotify mapping: ${spotifyTrack.id} -> ${rematched.mediaId}")\n                        } else {\n                            Timber.tag(TAG).w("Spotify rematch failed for ${spotifyTrack.id}; continuing normal recovery")\n                        }\n                    } catch (e: Exception) {\n                        Timber.tag(TAG).w(e, "Spotify rematch failed for ${spotifyTrack.id}")\n                    }\n                }\n                return\n            }\n        }\n\n'''
          if marker not in s: raise SystemExit('Spotify error marker missing')
          s = s.replace(marker, insert + marker, 1)
          marker = '''            player.currentMediaItem?.mediaId?.let { mediaId ->\n                resetRetryCount(mediaId)\n'''
          replacement = '''            player.currentMediaItem?.mediaId?.let { mediaId ->\n                spotifyRematchAttempts.remove(mediaId)\n                resetRetryCount(mediaId)\n'''
          if marker not in s: raise SystemExit('Spotify success marker missing')
          s = s.replace(marker, replacement, 1)
          p.write_text(s)

          p = Path('app/src/main/kotlin/com/metrolist/music/playback/SpotifyYouTubeMapper.kt')
          s = p.read_text()
          marker = '''    /**\n     * Persists a user-chosen YouTube match for a Spotify track.\n'''
          method = '''    /** Invalidates a stale Spotify match and the process-local cache entry. */\n    suspend fun invalidateMatch(spotifyId: String) = withContext(Dispatchers.IO) {\n        memoryCache.remove(spotifyId)\n        database.deleteSpotifyMatch(spotifyId)\n    }\n\n'''
          if marker not in s: raise SystemExit('mapper marker missing')
          p.write_text(s.replace(marker, method + marker, 1))

          # #241: idempotent Cast callbacks, failure isolation, and local-playback recovery.
          p = Path('app/src/gms/kotlin/com/metrolist/music/playback/CastConnectionHandler.kt')
          s = p.read_text()
          s = s.replace('''    private var isReloadingQueue: Boolean = false\n''', '''    private var isReloadingQueue: Boolean = false\n    private var initialized = false\n    private var castWasPlayingBeforeEnd = false\n''', 1)
          s = s.replace('''        override fun onMediaError(error: com.google.android.gms.cast.MediaError) {\n            Timber.e("Cast media error: ${error.reason}")\n        }\n''', '''        override fun onMediaError(error: com.google.android.gms.cast.MediaError) {\n            Timber.e("Cast media error: ${error.reason}")\n            handleCastFailure("remote media error: ${error.reason}")\n        }\n''', 1)
          s = s.replace('''                        client.queueAppendItem(itemsToAdd.first(), null)\n''', '''                        itemsToAdd.forEach { client.queueAppendItem(it, null) }\n''', 1)
          marker = '''    private val sessionManagerListener = object : SessionManagerListener<CastSession> {\n'''
          helper = '''    private fun attachRemoteMediaClient(client: RemoteMediaClient?) {\n        if (remoteMediaClient === client) {\n            client?.unregisterCallback(remoteMediaClientCallback)\n            client?.registerCallback(remoteMediaClientCallback)\n            return\n        }\n        remoteMediaClient?.unregisterCallback(remoteMediaClientCallback)\n        remoteMediaClient = client\n        remoteMediaClient?.registerCallback(remoteMediaClientCallback)\n    }\n\n    private fun detachRemoteMediaClient() {\n        remoteMediaClient?.unregisterCallback(remoteMediaClientCallback)\n        remoteMediaClient = null\n    }\n\n    private fun handleCastFailure(reason: String) {\n        Timber.w("Cast failure: $reason")\n        val resumeLocal = castWasPlayingBeforeEnd || musicService.player.playWhenReady\n        detachRemoteMediaClient()\n        stopPositionUpdates()\n        _isCasting.value = false\n        _isConnecting.value = false\n        _castIsBuffering.value = false\n        castSession = null\n        if (resumeLocal && musicService.player.mediaItemCount > 0) musicService.player.play()\n    }\n\n'''
          if marker not in s: raise SystemExit('Cast listener marker missing')
          s = s.replace(marker, helper + marker, 1)
          s = s.replace('''            remoteMediaClient = session.remoteMediaClient\n            remoteMediaClient?.registerCallback(remoteMediaClientCallback)\n''', '''            attachRemoteMediaClient(session.remoteMediaClient)\n''', 2)
          s = s.replace('''        override fun onSessionEnding(session: CastSession) {\n            Timber.d("Cast session ending")\n''', '''        override fun onSessionEnding(session: CastSession) {\n            Timber.d("Cast session ending")\n            castWasPlayingBeforeEnd = remoteMediaClient?.isPlaying == true || musicService.player.playWhenReady\n''', 1)
          old = '''            remoteMediaClient?.unregisterCallback(remoteMediaClientCallback)\n            remoteMediaClient = null\n            \n            stopPositionUpdates()\n            \n            // Pause local playback when disconnecting from Cast\n            musicService.player.pause()\n'''
          new = '''            detachRemoteMediaClient()\n            stopPositionUpdates()\n            if (castWasPlayingBeforeEnd && musicService.player.mediaItemCount > 0) musicService.player.play()\n            castWasPlayingBeforeEnd = false\n'''
          if old not in s: raise SystemExit('Cast session end pattern missing')
          s = s.replace(old, new, 1)
          old = '''    fun initialize(): Boolean {\n        return try {\n            castContext = CastContext.getSharedInstance(context)\n'''
          new = '''    fun initialize(): Boolean {\n        if (initialized) return true\n        return try {\n            castContext = CastContext.getSharedInstance(context)\n'''
          if old not in s: raise SystemExit('Cast init pattern missing')
          s = s.replace(old, new, 1)
          s = s.replace('''            sessionManager?.addSessionManagerListener(sessionManagerListener, CastSession::class.java)\n            \n            // Check if already connected\n''', '''            sessionManager?.addSessionManagerListener(sessionManagerListener, CastSession::class.java)\n            initialized = true\n            \n            // Check if already connected\n''', 1)
          s = s.replace('''                remoteMediaClient = session.remoteMediaClient\n                remoteMediaClient?.registerCallback(remoteMediaClientCallback)\n                startPositionUpdates()\n''', '''                attachRemoteMediaClient(session.remoteMediaClient)\n                startPositionUpdates()\n''', 1)
          old = '''    fun release() {\n        stopPositionUpdates()\n        remoteMediaClient?.unregisterCallback(remoteMediaClientCallback)\n        sessionManager?.removeSessionManagerListener(sessionManagerListener, CastSession::class.java)\n    }\n'''
          new = '''    fun release() {\n        stopPositionUpdates()\n        syncResetJob?.cancel()\n        detachRemoteMediaClient()\n        sessionManager?.removeSessionManagerListener(sessionManagerListener, CastSession::class.java)\n        sessionManager = null\n        castContext = null\n        mediaRouter = null\n        routeSelector = null\n        castSession = null\n        initialized = false\n        _isCasting.value = false\n        _isConnecting.value = false\n    }\n'''
          if old not in s: raise SystemExit('Cast release pattern missing')
          p.write_text(s.replace(old, new, 1))

          # No unrelated files: only the targeted production files are staged below.
          Path('.github/workflows/batch2-coder.yml').unlink()
      - name: Format, test, lint, build, and review
        run: |
          set -euxo pipefail
          ./gradlew :app:ktlintFormat --no-daemon || ./gradlew ktlintFormat --no-daemon
          ./gradlew :app:testFossDebugUnitTest --no-daemon
          ./gradlew :app:assembleFossDebug :app:lintFossDebug --no-daemon
          git diff --check
          git status --short
          git diff --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main app/src/gms
          git diff --cached --name-only
          test "$(git diff --cached --name-only | wc -l)" -gt 0
          git commit -m 'fix: resolve playlist, crossfade, Spotify sync, and Chromecast issues'
          git push origin HEAD:batch-2-fixes
