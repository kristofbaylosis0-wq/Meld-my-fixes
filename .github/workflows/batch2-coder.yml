name: Batch 2 coder
on:
  push:
    branches: [batch-2-fixes]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Apply fixes
        run: python3 scripts/apply_batch2.py
      - name: Format, test, lint, build
        run: |
          set -euxo pipefail
          ./gradlew :app:ktlintFormat --no-daemon || ./gradlew ktlintFormat --no-daemon
          ./gradlew :app:testFossDebugUnitTest --no-daemon
          ./gradlew :app:assembleFossDebug :app:lintFossDebug --no-daemon
          git diff --check
      - name: Review and commit single batch
        run: |
          set -euxo pipefail
          git status --short
          git diff --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main app/src/gms
          test "$(git diff --cached --name-only | wc -l)" -gt 0
          git commit -m 'fix: resolve playlist, crossfade, Spotify sync, and Chromecast issues'
          git rm scripts/apply_batch2.py .github/workflows/batch2-coder.yml
          git commit --amend --no-edit
          git push origin HEAD:batch-2-fixes
